seed: ${generate_random_seed:}

data_dir: ${hydra:runtime.cwd}/data

outputs_dir: ${hydra:runtime.cwd}/outputs

outputs_subdir: dev

job_subdir: dev

hydra:
  run:
    dir: outputs/${outputs_subdir}/${hydra.job.name}/${job_subdir}/${now:%Y-%m-%d_%H-%M-%S-%f}
  job:
    chdir: true
  verbose: false

wandb:
  project: operator-cow
  dir: ${hydra:runtime.cwd}/outputs
  mode: online
  anonymous: allow
  tags:
    - development

data:
  path: /data/path/placeholder
  batch_size: 32

log: False

model:
  name: GNOT
  trunk_size: 50
  branch_sizes: [3,3,3,3]
  output_size: 3
  space_dim: 2
  n_layers: 3
  n_hidden: 96
  n_head: 8
  n_experts: 4
  n_inner: 4
  mlp_layers: 4
  attn_type: linear
  act: gelu
  ffn_dropout: 0.0
  attn_dropout: 0.0
  horiz_fourier_dim: 0
  AE_weights_path: /data/path/placeholder
  surrogate_weights_path: /data/path/placeholder
  ae:
    layers: [100, 128, 256, 128, 32]

inverse:
  lambda_reg: 0.01
  lambda_bif: 0.1
  lambda_sv: 0.01
  lambda_mes: 1.0
  max_iters: 2000
  eps: 0.000006
  batch_size: 4
  lr: 0.5
  log_every: 100


