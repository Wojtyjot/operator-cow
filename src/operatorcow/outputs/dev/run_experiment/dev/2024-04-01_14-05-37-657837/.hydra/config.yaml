seed: ${generate_random_seed:}
data_dir: ${hydra:runtime.cwd}/data
outputs_dir: ${hydra:runtime.cwd}/outputs
outputs_subdir: dev
job_subdir: dev
wandb:
  project: AORTA
  dir: ${hydra:runtime.cwd}/outputs
  mode: online
  anonymous: allow
  tags:
  - development
data:
  path_train: /home/wssk-ptw/Operator/AORTA_DATASET/GNOT_train_AORTA.npy
  path_test: /home/wssk-ptw/Operator/AORTA_DATASET/GNOT_test_AORTA.npy
  batch_size: 64
model:
  name: GNOT
  n_layers: 3
  n_hidden: 96
  n_head: 4
  n_experts: 4
  n_inner: 4
  mlp_layers: 4
  attn_type: linear
  act: gelu
  ffn_dropout: 0.0
  attn_dropout: 0.0
  horiz_fourier_dim: 0
training:
  epochs: 500
  grad_clip: 1000.0
optimizer:
  lr: 0.001
  weight_decay: 5.0e-05
  beta1: 0.9
  beta2: 0.999
